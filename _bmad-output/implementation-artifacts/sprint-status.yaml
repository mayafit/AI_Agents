  # Epic 31: Global Installation & Federated Knowledge Stores (Phase 5)
  # Goal: Make WHERE a project's knowledge lives a property of the PROJECT, not of the machine it was
  # installed on and not of the install scope (the F26 thesis). Four threads: (A) binding authority —
  # _bmad-output/project-layout.yaml becomes the single authoritative, UNCONDITIONALLY-written record of
  # knowledge topology, and _bmad/bmm/config.yaml becomes a one-way GENERATED artifact derived from it so
  # all 39 existing skill config references stay unchanged; (B) two federated knowledge stores — the single
  # knowledgebase question splits into two INDEPENDENT questions (system requirements = brief + PRD;
  # software requirements = architecture + UX + epics), EACH choosing its OWN backend, with sprint
  # management remaining a third separate location and story files following it (FR267); (C) a Confluence
  # backend, MCP-conditional through the SAME canonical mcp-detection-pattern-spec.md the 13 sprint skills
  # use for Jira, with NO mirror / NO cache / NO sync — an unreachable Confluence is a misconfiguration and
  # FAILS LOUD; (D) install scope becomes a wizard question rather than only the --global flag, a global
  # install does no project-scoped work, and `ma-agents bind` supplies the per-project answers afterwards.
  # Driver: bindings live today in _bmad/bmm/config.yaml and _bmad/ is gitignored (.gitignore:20), so
  # knowledge locations are PER-MACHINE — two developers on one project can silently diverge, and a global
  # install (no project in scope) writes them nowhere at all. Verified against source: bin/cli.js:1441
  # (`if (installScope === 'global')`, under the "Step 3.4: Filter out BMAD agents for global scope"
  # comment at 1440) does strip every category==='bmad' agent and tell the user to re-run without --global;
  # the larger guard is bin/cli.js:1454 (`if (installScope === 'project')`) which skips the ENTIRE BMAD
  # integration. bin/cli.js:605 is the project-layout.yaml path inside writeProjectLayoutYaml() (fn at 604)
  # and 606-616 not only skips the write in single-repo mode but UNLINKS an existing file — Story 31.2 must
  # remove that deletion branch, since FR263 makes the file authoritative.
  # FR Coverage: FR248-FR265, FR267, NFR76-NFR83 — the COMPLETE live F26 set (Architecture Decision P5-9,
  # sub-decisions P5-9.1…P5-9.8; PRD F26). FR266 (Confluence local mirror) was RETIRED at P5-9 BEFORE
  # implementation and deliberately has NO story — if a story starts describing sync or conflict
