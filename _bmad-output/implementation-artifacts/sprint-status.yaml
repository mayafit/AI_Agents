  31-8-confluence-backend-space-and-root-page: backlog   # blocked on 31.5 — when a store selects the confluence backend, ask which Confluence SPACE it lives in (FR259) and which ROOT PAGE its artifacts are created under (FR260). Blank root page => ma-agents generates one named {project_name}, uses it, and TELLS THE USER the page name that was created. Persist the space key and root-page identity into project-layout.yaml through 31.2's schema and NOTHING ELSE — no token, no username, no credential-bearing URL, no session state; test the written record contains only non-secret identity (NFR79). ma-agents stores NO Confluence credentials anywhere on disk; authentication is entirely the MCP server's responsibility (P5-9.6) — there is no credential prompt, file or field. The two stores configure independently: one confluence and one file-system, or both confluence in different spaces (FR257). Configuration must SUCCEED WITHOUT CONTACTING CONFLUENCE — collecting a space key and a page name is offline configuration; reachability is a RUNTIME question answered by 31.9 (NFR80), and install must not require network. Under --yes confluence is never selected implicitly. Root-page CREATION against a live Confluence is an MCP write and belongs to 31.10. OQ-4 (title vs opaque page id for root-page identity) interacts with NFR79 and with 31.10's rename handling. (FR259, FR260, NFR79)
  31-9-confluence-mcp-conditional-routing-fail-loud: backlog   # blocked on 31.8 — a confluence-backed store reads and writes ONLY when a Confluence MCP is available at runtime; detection, routing and failure handling follow the CANONICAL mcp-detection-pattern-spec.md, the same pattern the 13 sprint skills use for Jira. NO second bespoke mechanism (FR261, NFR17) — a reviewer who knows the Jira path must be able to read the Confluence path without learning a second convention. Gateway check at the START of the workflow before any read/write (§2.6); file-system is the default when the backend is absent or empty (§2.7). FAIL LOUD (FR262): with the backend set to confluence and no MCP available the skill HALTS — no silent degradation, no fallback to a local copy — and the error names FOUR things: the affected store, its configured space, that no Confluence MCP was detected, and how to configure one. THERE IS NO MIRROR, NO CACHE, THEREFORE NO SYNC (P5-9.6) — assert no local artifact is produced on the Confluence path. The file-system branch is completely unchanged (§6.6 additive-backend rule). NFR80 air-gap stated correctly: install, skill loading and every file-system-backed workflow complete with NO network at all (prove with egress blocked); a confluence store additionally needs its host reachable, which an intra-perimeter Confluence Server/DC satisfies on an air-gapped network; a no-network-whatsoever project keeps both stores file-system. Embedded per skill, deployed unchanged through both pipelines (§7.1-§7.3) — no lib/installer.js or lib/bmad.js change. THIS is where Epic 14 Story 14.2's blocker is discharged. Resist any "just this once" local fallback — that is FR266, and it is RETIRED. (FR261, FR262, NFR80)
  31-10-confluence-page-tree-one-page-per-artifact: backlog   # blocked on 31.9 — ONE Confluence page per markdown artifact, nested under the FR260 root page to MATCH THE SOURCE FOLDER STRUCTURE (P5-9.7): a sharded PRD becomes an index page with its capability shards as child pages. Not flattened into sibling pages and not collapsed into one page per store — both are explicitly rejected at P5-9.7 because they destroy per-artifact page history and comments. Where the root page was left blank at 31.8, create it here named {project_name} and report the created name. All writes go exclusively through the 31.9 MCP with its fail-loud gate; no local copy is written (P5-9.6). Re-running against an already-published store UPDATES existing pages rather than duplicating them so history and comments survive — identity resolution per OQ-4, which MUST be settled before this story starts or a renamed/re-sharded artifact orphans its page. Only that store's artifacts are published: a confluence system-requirements store publishes brief + PRD and does NOT publish architecture, UX, epics, story files or sprint-status.yaml (FR255/FR256/FR267). Per-artifact page templates and any hierarchy beyond this tree mapping are DEFERRED at P5-9 and not implemented. Keep the operation set small and explicitly enumerated the way mcp-detection-pattern-spec.md §3 enumerates the sprint operations catalog. Tests use a mocked MCP surface (tree shape, update-not-duplicate, store-scoped selection). Largest genuinely-new surface in the epic. (P5-9.7; completes FR255, FR256, FR260)
  31-11-install-scope-wizard-question-no-project-work: backlog   # blocked on 31.1 — install scope becomes an INTERACTIVE WIZARD QUESTION ("Install for this project only, or globally for your user account?") asked BEFORE platform/agent selection, with project-level as the DEFAULT (FR248). The --global flag is RETAINED as the non-interactive equivalent for --yes/CI — it is no longer the only way to reach a global install and it is not removed. A global install performs NO PROJECT-SCOPED WORK (FR251): no project-context.md, no project-layout.yaml, no knowledge-store prompts — deferred to bind (31.13); test that a global install writes nothing under any project root. NFR76 is the criterion most likely to catch a regression: a user who accepts the project-level default reaches an install BYTE-IDENTICAL to today's with no additional prompts on subsequent runs — compare the full output tree before and after (extends NFR34 to install scope). NFR77: global install fully air-gapped on the same terms as project install (bundled cache, no npm/git/CDN), proven with egress blocked, re-asserting NFR2/NFR50/NFR57. When a globally-installed skill activates in a project with no project-layout.yaml, the bind step is OFFERED (the offer is here; the command is 31.13). A partial scope prompt already exists near bin/cli.js:1420 (Project level / Global / Custom path) — FR248 promotes it to a first-class question asked earlier. Correct under EITHER 31.1 verdict per P5-9.8: bind is the only writer of project-scoped state whether or not BMAD itself installs globally. (FR248, FR251, NFR76, NFR77)
  31-12-global-bmad-install-or-degradation-path: backlog   # blocked on 31.1 + 31.11 — SCOPE DETERMINED BY THE 31.1 GATE VERDICT. Size: Medium on PASS, Small on FAIL. This is deliberately the ONLY place the verdict is felt. On PASS: BMAD modules and agents install globally alongside ma-agents skills (FR249) — LIFT the bin/cli.js:1440-1451 filter that strips every category==='bmad' agent and tells the user to re-run without --global, and WIDEN the bin/cli.js:1454 `if (installScope === 'project')` guard on the whole BMAD integration block; the global module set is the SAME default set FR123 defines for project installs (every non-retired module from lib/bmad-cache/cache-manifest.json, bmm force-included, experimental filtered out, --bmad-modules override honoured identically); fully air-gapped from the bundled cache with egress blocked (NFR77); remove the now-stale warning and "re-run without --global" guidance rather than leaving it. On FAIL: ma-agents skills install globally, BMAD stays project-scoped, and the installer reports EXACTLY THREE THINGS (FR250) — that BMAD remains project-scoped, the command that installs BMAD into a project, and that the F26 knowledge-store requirements are UNAFFECTED; phrased as a clear statement of a SUPPORTED configuration, not a warning or an error. EITHER WAY: no part of 31.2-31.10 changes (P5-9.8), and a test proves a globally-installed skill resolves a bound project's topology from the project root alone (NFR83). Mirrors the 30.5 precedent requiring an explicit graceful-degradation fallback. If PASS, the two change sites named in 31.1 are the whole surface — resist widening. (FR249, FR250 degradation path, NFR77)
  31-13-ma-agents-bind-and-status-scope-reporting: backlog   # blocked on 31.3 + 31.5 + 31.8 — `ma-agents bind` collects ONLY the project-scoped answers (the two knowledge-store bindings, reusing 31.5's and 31.8's collection flow, plus the FR112 sprint-management location) and writes _bmad-output/project-layout.yaml plus project-context.md. It INSTALLS NO SKILLS AND NO BMAD MODULES — test a bind run produces no skill directories and no _bmad/ tree beyond the generated config.yaml. Also OFFERED AUTOMATICALLY when a globally-installed skill activates in a project with no project-layout.yaml (FR252); the offer never runs bind without the user's choice. NFR78 idempotent and non-destructive: re-running against an already-bound project REPORTS the existing bindings and changes nothing unless the user explicitly edits an answer — run bind twice and assert every file is byte-identical. NEVER overwrites an existing project-context.md (NFR78, consistent with NFR23/FR84) — left untouched, generation skipped with a notice. Regenerates config.yaml from the layout it just wrote (P5-9.3) and never touches config.user.yaml (P5-9.4). `ma-agents status` reports the ACTIVE INSTALL SCOPE and, for a global install, lists which projects on this machine have been bound and FOR EACH whether a readable project-layout.yaml was found at its root (FR253) — so a bound-then-moved project is visible as such, not silently listed healthy. OQ-1: the bound-projects record is per-machine, lives OUTSIDE any project, is never written into committed artifacts, and losing it degrades `status` output only — resolution depends on the project root alone (NFR83). Verified: bin/cli.js already routes `case 'status':` at line 2081; there is no `bind` command today. Reuse 31.5's collection functions directly — a second drifting copy of the store questions inside bind is the most likely defect this story can introduce. The bind step is the seam P5-9.8 relies on, which is why the FR250 spike gates HOW MUCH of global install ships rather than WHETHER the architecture holds — keep it independent of the verdict. (FR252, FR253, NFR78, NFR83)
